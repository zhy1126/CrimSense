[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "crimsense"
version = "0.4.0"
description = "Manuscript-aligned SAT crime simulation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2", "shapely>=2", "pyproj>=3.6", "Jinja2>=3.1", "tokenizers>=0.20", "matplotlib>=3.8"]
[project.scripts]
crimsense = "experiments.cli:main"
[tool.setuptools.packages.find]
include = ["agents*", "simulation*", "experiments*", "analysis*"]
[tool.setuptools.package-data]
agents = ["prompts/*.txt", "prompts/*.json"]

[tool.black]
target-version = ["py311"]
